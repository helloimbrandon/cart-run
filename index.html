<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart Run — Beat the Cart Clock</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #9fd7ff; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif; color: #fff; }
    #c { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 14px; left: 14px;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6), 0 0 2px rgba(0,0,0,0.7);
    }
    #hud .row { font-size: 26px; line-height: 1.2; font-weight: 800; letter-spacing: 0.5px; }
    #hud .row#cartsRow.low { color: #ff7060; animation: pulse 0.45s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.55; } }
    #hud .small { font-size: 13px; opacity: 0.85; font-weight: 500; margin-top: 8px; max-width: 380px; }
    #speedoWrap {
      position: fixed; right: 14px; top: 14px;
      pointer-events: none;
      text-align: right;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    #speedoWrap .big { font-size: 56px; font-weight: 900; line-height: 1; letter-spacing: 1px; }
    #speedoWrap .lbl { font-size: 12px; opacity: 0.85; letter-spacing: 2px; }
    #speedoWrap.boost .big { color: #ffe46b; text-shadow: 0 0 18px rgba(255,200,40,0.7); }
    #boostMeter {
      position: fixed; right: 14px; top: 124px;
      width: 220px; height: 18px;
      background: rgba(0,0,0,0.45);
      border: 2px solid rgba(255,255,255,0.45);
      border-radius: 5px;
      overflow: hidden;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }
    #boostFill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #ff7040, #ffd040, #fff19a);
      box-shadow: 0 0 18px rgba(255,200,80,0.6);
      transition: width 0.08s linear, background 0.2s;
    }
    #boostFill.empty { background: linear-gradient(90deg, #5a2020, #6a3030); box-shadow: none; }
    #boostLabel {
      position: fixed; right: 14px; top: 144px;
      width: 220px; text-align: center; font-size: 11px; font-weight: 800;
      letter-spacing: 2px; opacity: 0.9; pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    #boostLabel.empty { color: #ff7060; }
    #overlay {
      position: fixed; inset: 0;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.78));
      backdrop-filter: blur(2px);
    }
    #overlay h1 { font-size: 64px; margin: 0; letter-spacing: 2px; }
    #overlay h1.win { color: #ffe46b; text-shadow: 0 4px 18px rgba(255,200,40,0.5); }
    #overlay h1.lose { color: #ff7060; text-shadow: 0 4px 18px rgba(255,90,60,0.5); }
    #overlay p { font-size: 18px; margin: 0; opacity: 0.92; max-width: 680px; text-align: center; }
    #overlay button {
      padding: 12px 28px; font-size: 17px; border: none; border-radius: 10px;
      background: #ffe46b; color: #222; font-weight: 800; cursor: pointer; letter-spacing: 0.5px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }
    #overlay button:hover { background: #fff19a; }
    #title-card {
      position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%);
      pointer-events: none; text-align: center;
      text-shadow: 0 3px 14px rgba(0,0,0,0.55);
      transition: opacity 1s ease 1.6s;
    }
    #title-card .t1 { font-size: 44px; font-weight: 900; letter-spacing: 3px; }
    #title-card .t2 { font-size: 16px; opacity: 0.9; margin-top: 4px; }
    #title-card.fade { opacity: 0; }
    #vignette {
      position: fixed; inset: 0; pointer-events: none;
      box-shadow: inset 0 0 0 0 rgba(0,0,0,0);
      transition: box-shadow 0.15s ease-out;
      mix-blend-mode: multiply;
    }
    #streaks {
      position: fixed; inset: 0; pointer-events: none;
      width: 100vw; height: 100vh;
      mix-blend-mode: screen;
    }
    #boostBlast {
      position: fixed; inset: 0; pointer-events: none;
      width: 100vw; height: 100vh;
      mix-blend-mode: screen;
      opacity: 0;
    }
    #banner {
      position: fixed; left: 50%; top: 38%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      font-size: 64px; font-weight: 900; letter-spacing: 5px;
      color: #ffe46b;
      text-shadow: 0 4px 24px rgba(0,0,0,0.7), 0 0 8px rgba(0,0,0,0.6);
      opacity: 0;
      transition: opacity 0.25s ease-out, transform 0.5s ease-out;
      text-align: center;
    }
    #banner.show { opacity: 1; }
    #banner .sub { display: block; font-size: 18px; opacity: 0.85; letter-spacing: 3px; margin-top: 6px; color:#fff; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <canvas id="streaks"></canvas>
  <canvas id="boostBlast"></canvas>
  <div id="vignette"></div>

  <div id="hud">
    <div id="cartsRow" class="row">🛒 <span id="carts">150</span></div>
    <div class="row">🏬 <span id="dist">0</span> m</div>
    <div class="row" style="font-size:16px;">📍 STAGE <span id="lvl">1</span>/3 · <span id="lvlName">SUBURB</span></div>
    <div class="small">WASD / Arrows — steer & throttle &nbsp;·&nbsp; SPACE — boost &nbsp;·&nbsp; M — mute &nbsp;·&nbsp; Carts = your timer. Dodge oncoming traffic. <strong>FLOOR IT.</strong></div>
    <div class="small" id="audioLbl" style="margin-top:4px; opacity:0.7;">🎵 dark d&amp;b · 170 BPM · press any key to start audio</div>
  </div>

  <div id="speedoWrap">
    <div class="big"><span id="speed">0</span></div>
    <div class="lbl">MPH</div>
  </div>
  <div id="boostMeter"><div id="boostFill"></div></div>
  <div id="boostLabel">BOOST</div>

  <div id="title-card">
    <div class="t1">CART RUN</div>
    <div class="t2">3 deliveries · 1 truck · no restock</div>
  </div>

  <div id="banner"></div>

  <div id="overlay">
    <h1 id="title">YOU MADE IT</h1>
    <p id="subtitle"></p>
    <button id="again">Drive Again</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // =========================================================================
    // helpers
    // =========================================================================
    const rand = (min, max) => min + Math.random() * (max - min);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    function setShadows(obj, cast = true, receive = true) {
      obj.traverse(o => { if (o.isMesh) { o.castShadow = cast; o.receiveShadow = receive; } });
    }
    function makeTextSign(text, w = 10, h = 2.6, bg = '#ff4a3a', fg = '#ffffff') {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = fg;
      ctx.font = '900 180px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 6);
      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 4;
      return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
    }

    // =========================================================================
    // renderer / scene / camera / post-processing
    // =========================================================================
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fd7ff);
    scene.fog = new THREE.Fog(0x9fd7ff, 70, 280);

    const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.1, 900);
    camera.position.set(0, 7, -12);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const afterimagePass = new AfterimagePass(0.0);
    composer.addPass(afterimagePass);
    composer.addPass(new OutputPass());

    const streakCanvas = document.getElementById('streaks');
    const streakCtx = streakCanvas.getContext('2d');
    const blastCanvas = document.getElementById('boostBlast');
    const blastCtx = blastCanvas.getContext('2d');

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight, false);
      composer.setSize(innerWidth, innerHeight);
      const dpr = Math.min(devicePixelRatio, 2);
      for (const cv of [streakCanvas, blastCanvas]) {
        cv.width = innerWidth * dpr;
        cv.height = innerHeight * dpr;
        cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }
    addEventListener('resize', resize);
    resize();

    // ----- manga boost blast: pre-baked random line angles -----
    const boostLineAngles = [];
    const BOOST_LINE_COUNT = 96;
    for (let i = 0; i < BOOST_LINE_COUNT; i++) {
      const baseAngle = (i / BOOST_LINE_COUNT) * Math.PI * 2;
      const jitter = (Math.random() - 0.5) * 0.05;
      boostLineAngles.push({
        angle: baseAngle + jitter,
        width: 1.4 + Math.random() * 4.2,
        lenMul: 0.65 + Math.random() * 0.65,
        alphaMul: 0.5 + Math.random() * 0.55,
      });
    }
    let boostBlastTimer = 0;
    const BOOST_BLAST_DUR = 0.6;
    function triggerBoostBlast() {
      boostBlastTimer = BOOST_BLAST_DUR;
      blastCanvas.style.opacity = '1';
    }
    function drawBoostBlast(progress) {
      const w = innerWidth, h = innerHeight;
      const cx = w / 2, cy = h * 0.48;
      blastCtx.clearRect(0, 0, w, h);
      const maxLen = Math.max(w, h) * 0.85;
      const fade = 1 - progress * progress;
      for (const line of boostLineAngles) {
        const innerR = maxLen * (0.05 + progress * 0.15);
        const outerR = maxLen * line.lenMul * (0.4 + progress * 0.6);
        const cosA = Math.cos(line.angle);
        const sinA = Math.sin(line.angle);
        const x1 = cx + cosA * innerR;
        const y1 = cy + sinA * innerR;
        const x2 = cx + cosA * outerR;
        const y2 = cy + sinA * outerR;
        const grad = blastCtx.createLinearGradient(x1, y1, x2, y2);
        const alpha = fade * line.alphaMul * 0.65;
        grad.addColorStop(0,   `rgba(225, 240, 255, ${alpha * 0.3})`);
        grad.addColorStop(0.3, `rgba(190, 225, 255, ${alpha})`);
        grad.addColorStop(1,   `rgba(140, 195, 255, 0)`);
        blastCtx.strokeStyle = grad;
        blastCtx.lineWidth = line.width;
        blastCtx.lineCap = 'round';
        blastCtx.beginPath();
        blastCtx.moveTo(x1, y1);
        blastCtx.lineTo(x2, y2);
        blastCtx.stroke();
      }
      // focus hole
      const clearR = maxLen * (0.08 + progress * 0.07);
      const clearGrd = blastCtx.createRadialGradient(cx, cy, 0, cx, cy, clearR);
      clearGrd.addColorStop(0, 'rgba(0,0,0,1)');
      clearGrd.addColorStop(0.6, 'rgba(0,0,0,0.8)');
      clearGrd.addColorStop(1, 'rgba(0,0,0,0)');
      blastCtx.globalCompositeOperation = 'destination-out';
      blastCtx.fillStyle = clearGrd;
      blastCtx.fillRect(0, 0, w, h);
      blastCtx.globalCompositeOperation = 'source-over';
    }

    // =========================================================================
    // lights (single sun + hemi + ambient; sun follows truck)
    // =========================================================================
    const sun = new THREE.DirectionalLight(0xfff2d8, 1.05);
    sun.position.set(60, 90, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const sd = 55;
    sun.shadow.camera.left = -sd; sun.shadow.camera.right = sd;
    sun.shadow.camera.top = sd;   sun.shadow.camera.bottom = -sd;
    sun.shadow.camera.near = 1;   sun.shadow.camera.far = 260;
    sun.shadow.bias = -0.0005;
    scene.add(sun);
    const hemi = new THREE.HemisphereLight(0xb0d8ff, 0x6b8a4a, 0.55);
    scene.add(hemi);
    scene.add(new THREE.AmbientLight(0xffffff, 0.18));
    const shadowTarget = new THREE.Object3D();
    scene.add(shadowTarget);
    sun.target = shadowTarget;

    // ---------- distant horizon ring (mountains + far skyline) ----------
    // Persistent across levels; tinted per stage. Follows truck so it's always far away.
    const horizonGroup = new THREE.Group();
    scene.add(horizonGroup);
    function buildHorizon() {
      const ringR = 330;
      const peaks = 72;
      for (let i = 0; i < peaks; i++) {
        const angle = (i / peaks) * Math.PI * 2;
        const jitter = rand(-0.04, 0.04);
        const h = rand(28, 60);
        const w = rand(36, 70);
        const m = new THREE.Mesh(
          new THREE.ConeGeometry(w, h, 4),
          new THREE.MeshLambertMaterial({ color: 0x6a8aa0 })
        );
        m.position.set(Math.cos(angle + jitter) * ringR, h / 2 - 2, Math.sin(angle + jitter) * ringR);
        m.rotation.y = rand(0, Math.PI * 2);
        horizonGroup.add(m);
      }
      // a faint second ring of darker silhouettes further out for depth
      for (let i = 0; i < 36; i++) {
        const angle = (i / 36) * Math.PI * 2;
        const h = rand(48, 90);
        const w = rand(70, 120);
        const m = new THREE.Mesh(
          new THREE.ConeGeometry(w, h, 4),
          new THREE.MeshLambertMaterial({ color: 0x4a5a78 })
        );
        m.position.set(Math.cos(angle) * 430, h / 2 - 6, Math.sin(angle) * 430);
        m.rotation.y = rand(0, Math.PI * 2);
        horizonGroup.add(m);
      }
    }
    buildHorizon();
    function tintHorizon(near, far) {
      let i = 0;
      horizonGroup.traverse(o => {
        if (!o.isMesh) return;
        o.material.color.setHex(i < 72 ? near : far);
        i++;
      });
    }

    // =========================================================================
    // shopping cart mesh (yellow, nested-grocery-cart look)
    // =========================================================================
    const CART_YELLOW = 0xf3c12d;
    const CART_DARK   = 0xa07d18;

    function makeCartMesh() {
      const g = new THREE.Group();
      // basket outer
      const basket = new THREE.Mesh(
        new THREE.BoxGeometry(0.58, 0.42, 0.78),
        new THREE.MeshLambertMaterial({ color: CART_YELLOW })
      );
      basket.position.y = 0.52;
      g.add(basket);
      // basket inner (dark to read as hollow when nested)
      const inner = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.34, 0.7),
        new THREE.MeshLambertMaterial({ color: CART_DARK })
      );
      inner.position.y = 0.58;
      g.add(inner);
      // basket grid bars (lateral)
      const barMat = new THREE.MeshLambertMaterial({ color: CART_YELLOW });
      for (let i = -1; i <= 1; i++) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.02, 0.02), barMat);
        bar.position.set(0, 0.62, i * 0.3);
        g.add(bar);
      }
      // handle bar
      const handle = new THREE.Mesh(
        new THREE.BoxGeometry(0.62, 0.05, 0.05),
        new THREE.MeshLambertMaterial({ color: CART_YELLOW })
      );
      handle.position.set(0, 0.92, -0.42);
      g.add(handle);
      // handle posts
      for (const sx of [-1, 1]) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.45, 0.05), barMat);
        post.position.set(sx * 0.29, 0.72, -0.4);
        g.add(post);
      }
      // legs
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        const l = new THREE.Mesh(
          new THREE.BoxGeometry(0.05, 0.45, 0.05),
          new THREE.MeshLambertMaterial({ color: CART_YELLOW })
        );
        l.position.set(sx * 0.24, 0.28, sz * 0.32);
        g.add(l);
      }
      // wheels
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        const w = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 7, 6),
          new THREE.MeshLambertMaterial({ color: 0x222 })
        );
        w.position.set(sx * 0.24, 0.08, sz * 0.34);
        g.add(w);
      }
      setShadows(g, true, true);
      return g;
    }

    // =========================================================================
    // box truck (white cargo, roll-up door)
    // =========================================================================
    const truck = new THREE.Group();

    // chassis
    const chassis = new THREE.Mesh(
      new THREE.BoxGeometry(2.7, 0.4, 7.6),
      new THREE.MeshLambertMaterial({ color: 0x222222 })
    );
    chassis.position.set(0, 0.7, -0.4);
    truck.add(chassis);

    // cab (front)
    const CAB_Z = 2.3;
    const cab = new THREE.Mesh(
      new THREE.BoxGeometry(2.5, 1.9, 2.4),
      new THREE.MeshLambertMaterial({ color: 0xfafafa })
    );
    cab.position.set(0, 1.85, CAB_Z);
    truck.add(cab);
    const cabRoof = new THREE.Mesh(
      new THREE.BoxGeometry(2.52, 0.1, 2.42),
      new THREE.MeshLambertMaterial({ color: 0xdddddd })
    );
    cabRoof.position.set(0, 2.85, CAB_Z);
    truck.add(cabRoof);
    // windshield
    const ws = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, 1.0, 0.05),
      new THREE.MeshBasicMaterial({ color: 0x1f3a55 })
    );
    ws.position.set(0, 2.25, CAB_Z + 1.21);
    truck.add(ws);
    // side windows
    for (const sx of [-1, 1]) {
      const sw = new THREE.Mesh(
        new THREE.BoxGeometry(0.05, 0.9, 1.4),
        new THREE.MeshBasicMaterial({ color: 0x1f3a55 })
      );
      sw.position.set(sx * 1.27, 2.15, CAB_Z);
      truck.add(sw);
    }
    // headlights
    for (const sx of [-1, 1]) {
      const h = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, 0.3, 0.05),
        new THREE.MeshBasicMaterial({ color: 0xfff7c2 })
      );
      h.position.set(sx * 0.85, 1.3, CAB_Z + 1.23);
      truck.add(h);
    }
    // grill
    const grill = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 0.5, 0.06),
      new THREE.MeshLambertMaterial({ color: 0x333 })
    );
    grill.position.set(0, 0.95, CAB_Z + 1.23);
    truck.add(grill);

    // cargo box (open back) — built from 5 panels
    const BOX_W = 2.7, BOX_H = 4.4, BOX_D = 5.6;
    const BOX_CY = 0.9 + BOX_H / 2;  // center Y (~3.1 → top at 5.3)
    const BOX_CZ = -2.0;              // truck-local center Z
    const boxMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const boxTrimMat = new THREE.MeshLambertMaterial({ color: 0xc8c8c8 });
    // floor
    const boxFloor = new THREE.Mesh(new THREE.BoxGeometry(BOX_W, 0.12, BOX_D), boxTrimMat);
    boxFloor.position.set(0, 0.9, BOX_CZ);
    truck.add(boxFloor);
    // left wall
    const boxLW = new THREE.Mesh(new THREE.BoxGeometry(0.1, BOX_H, BOX_D), boxMat);
    boxLW.position.set(-BOX_W / 2, BOX_CY, BOX_CZ);
    truck.add(boxLW);
    // right wall
    const boxRW = new THREE.Mesh(new THREE.BoxGeometry(0.1, BOX_H, BOX_D), boxMat);
    boxRW.position.set(BOX_W / 2, BOX_CY, BOX_CZ);
    truck.add(boxRW);
    // top
    const boxTop = new THREE.Mesh(new THREE.BoxGeometry(BOX_W + 0.1, 0.12, BOX_D), boxMat);
    boxTop.position.set(0, BOX_CY + BOX_H / 2, BOX_CZ);
    truck.add(boxTop);
    // front wall (between cab and cargo)
    const boxFront = new THREE.Mesh(new THREE.BoxGeometry(BOX_W, BOX_H, 0.1), boxMat);
    boxFront.position.set(0, BOX_CY, BOX_CZ + BOX_D / 2);
    truck.add(boxFront);
    // side panel ribs (for box-truck character)
    for (const sx of [-1, 1]) {
      for (let i = -2; i <= 2; i++) {
        const rib = new THREE.Mesh(
          new THREE.BoxGeometry(0.05, BOX_H * 0.9, 0.04),
          boxTrimMat
        );
        rib.position.set(sx * (BOX_W / 2 + 0.04), BOX_CY, BOX_CZ + i * 1.0);
        truck.add(rib);
      }
    }
    // rear frame
    const rearTopBar = new THREE.Mesh(
      new THREE.BoxGeometry(BOX_W + 0.2, 0.12, 0.12),
      boxTrimMat
    );
    rearTopBar.position.set(0, BOX_CY + BOX_H / 2 - 0.05, BOX_CZ - BOX_D / 2);
    truck.add(rearTopBar);
    // rolled-up door (cylinder at top of rear opening)
    const door = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.3, BOX_W - 0.05, 18),
      new THREE.MeshLambertMaterial({ color: 0xe2e2e2 })
    );
    door.rotation.z = Math.PI / 2;
    door.position.set(0, BOX_CY + BOX_H / 2 - 0.45, BOX_CZ - BOX_D / 2 + 0.32);
    truck.add(door);
    // door track guides
    for (const sx of [-1, 1]) {
      const guide = new THREE.Mesh(
        new THREE.BoxGeometry(0.05, BOX_H * 0.95, 0.08),
        new THREE.MeshLambertMaterial({ color: 0x999 })
      );
      guide.position.set(sx * (BOX_W / 2 - 0.05), BOX_CY, BOX_CZ - BOX_D / 2 + 0.05);
      truck.add(guide);
    }
    // tail lights
    for (const sx of [-1, 1]) {
      const tl = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.25, 0.05),
        new THREE.MeshBasicMaterial({ color: 0xcc2020 })
      );
      tl.position.set(sx * 0.95, 1.0, BOX_CZ - BOX_D / 2 - 0.03);
      truck.add(tl);
    }

    function buildCartStack() {
      // 3 nested lines × 10 nested × 4 layers = 120 slots — fits inside the taller box
      const lineXs = [-0.85, 0, 0.85];
      const cartsPerLine = 10;
      const layers = 4;
      const lineSpacingZ = 0.45;
      const layerH = 0.85;
      const baseY = 1.05;
      const frontZ = BOX_CZ + BOX_D / 2 - 0.6;
      let idx = 0;
      for (let layer = 0; layer < layers; layer++) {
        for (let r = 0; r < cartsPerLine; r++) {
          for (let col = 0; col < lineXs.length; col++) {
            if (idx >= MAX_CARTS) return;
            const cart = makeCartMesh();
            const bx = lineXs[col];
            const by = baseY + layer * layerH;
            const bz = frontZ - r * lineSpacingZ;
            cart.position.set(bx, by, bz);
            cart.rotation.y = 0;
            // wobble state — base + spring-damper offsets so carts jostle in the bed
            cart._baseX = bx; cart._baseY = by; cart._baseZ = bz;
            cart._wobX = 0; cart._wobZ = 0; cart._wobR = 0;
            cart._wobVX = 0; cart._wobVZ = 0; cart._wobVR = 0;
            cartStack.add(cart);
            stackCarts.push(cart);
            idx++;
          }
        }
      }

    // ----- helpers for placing things along the curve -----
    const _tan = new THREE.Vector3();
    const _pt = new THREE.Vector3();
    function pointAt(t) { return curve.getPointAt(clamp(t, 0, 1), _pt.clone()); }
    function tangentAt(t) { return curve.getTangentAt(clamp(t, 0, 1), _tan.clone()).normalize(); }
    function rightFromTangent(tan) { return new THREE.Vector3(tan.z, 0, -tan.x).normalize(); }

    function buildRoadGeo(width, segments, lightShade, darkShade) {
      // alternating road tile shading (per pair of segments) — outrun-style speed cue
      const verts = [], colors = [], idx = [];
      const lc = new THREE.Color(lightShade);
      const dc = new THREE.Color(darkShade);
      for (let i = 0; i <= segments; i++) {
        const tt = i / segments;
        const p = pointAt(tt);
        const tn = tangentAt(tt);
        const rt = rightFromTangent(tn);
        verts.push(p.x + rt.x * width / 2, 0.04, p.z + rt.z * width / 2);
        verts.push(p.x - rt.x * width / 2, 0.04, p.z - rt.z * width / 2);
        const useLight = (Math.floor(i / 2) % 2) === 0;
        const c = useLight ? lc : dc;
        colors.push(c.r, c.g, c.b, c.r, c.g, c.b);
        if (i < segments) {
          const a = i * 2, b = i * 2 + 1, c2 = (i + 1) * 2, d = (i + 1) * 2 + 1;
          idx.push(a, b, d, a, d, c2);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      return geo;
    }

    function buildRumbleGeo(side, innerOff, width, segments) {
      // alternating red/white rumble strip — the classic arcade speed reference
      const verts = [], colors = [], idx = [];
      const red   = new THREE.Color(0xd02828);
      const white = new THREE.Color(0xf5f5f5);
      for (let i = 0; i <= segments; i++) {
        const tt = i / segments;
        const p = pointAt(tt);
        const tn = tangentAt(tt);
        const rt = rightFromTangent(tn);
        verts.push(p.x + rt.x * side * innerOff,        0.05, p.z + rt.z * side * innerOff);
        verts.push(p.x + rt.x * side * (innerOff + width), 0.05, p.z + rt.z * side * (innerOff + width));
        const isRed = (i % 2) === 0;
        const c = isRed ? red : white;
        colors.push(c.r, c.g, c.b, c.r, c.g, c.b);
        if (i < segments) {
          const a = i * 2, b = i * 2 + 1, c2 = (i + 1) * 2, d = (i + 1) * 2 + 1;
          idx.push(a, b, d, a, d, c2);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      return geo;
    }

    function buildStripGeo(widthOffset, width, segments) {
      // strip parallel to road, offset to one side (sits flat at y=0 → road is +0.04 above)
      const verts = [], idx = [];
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const p = pointAt(t);
        const tn = tangentAt(t);
        const rt = rightFromTangent(tn);
        const innerOff = widthOffset;
        const outerOff = widthOffset + width;
        verts.push(p.x + rt.x * innerOff, 0.0, p.z + rt.z * innerOff);
        verts.push(p.x + rt.x * outerOff, 0.0, p.z + rt.z * outerOff);
        if (i < segments) {
          const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
          idx.push(a, b, d, a, d, c);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      return geo;
    }

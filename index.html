      levelGroup.traverse(o => {
        if (o.isMesh) {
          o.geometry?.dispose();
          if (Array.isArray(o.material)) o.material.forEach(m => m?.dispose && m.dispose());
          else o.material?.dispose && o.material.dispose();
        }
      });
      scene.remove(levelGroup);
      levelGroup = new THREE.Group();
      scene.add(levelGroup);
      obstacles.length = 0;
      // remove any detached trail carts (they were anchored to a prior road)
      for (const c of detached) scene.remove(c);
      detached.length = 0;
      traffic.length = 0;
      boostPickups.length = 0;
      storeMesh = null;
    }

    function loadLevel(idx) {
      disposeLevel();
      const L = LEVELS[idx];
      // background / fog
      scene.background = new THREE.Color(L.skyColor);
      scene.fog.color.setHex(L.fogColor);
      scene.fog.near = L.fogNear;
      scene.fog.far = L.fogFar;
      sun.color.setHex(L.sunColor);
      hemi.color.setHex(L.hemiSky);
      hemi.groundColor.setHex(L.hemiGround);
      tintHorizon(L.mountainNear, L.mountainFar);

      // build curve
      const pts = L.points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
      curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
      curveLength = curve.getLength();

      // grass extends well beyond road (DoubleSide so it renders regardless of winding)
      const grassGeo = buildStripGeo(-200, 400, 220);
      const grass = new THREE.Mesh(
        grassGeo,
        new THREE.MeshLambertMaterial({ color: L.grassColor, side: THREE.DoubleSide })
      );
      grass.receiveShadow = true;
      levelGroup.add(grass);

      // road segments — alternating light/dark for speed reference
      const ROAD_SEG = Math.max(180, Math.floor(curveLength / 4));
      const roadLight = new THREE.Color(L.roadColor).offsetHSL(0, 0, 0.04).getHex();
      const roadDark  = L.roadColor;
      const roadGeo = buildRoadGeo(ROAD_W, ROAD_SEG, roadLight, roadDark);
      const road = new THREE.Mesh(
        roadGeo,
        new THREE.MeshLambertMaterial({ vertexColors: true })
      );
      road.receiveShadow = true;
      levelGroup.add(road);

      // rumble strips on both edges (red/white alternating, classic arcade)
      for (const side of [-1, 1]) {
        const innerOff = ROAD_W / 2 - 0.6;
        const rumbleGeo = buildRumbleGeo(side, innerOff, 0.6, ROAD_SEG);
        const rumble = new THREE.Mesh(
          rumbleGeo,
          new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })
        );
        levelGroup.add(rumble);
      }

      // sidewalks (outside the rumble strips)
      for (const side of [-1, 1]) {
        const swGeo = buildStripGeo(side * (ROAD_W / 2), side * 2, 220);
        const sw = new THREE.Mesh(
          swGeo,
          new THREE.MeshLambertMaterial({ color: 0xc8c8c0, side: THREE.DoubleSide })
        );
        sw.receiveShadow = true;
        levelGroup.add(sw);
      }

      // dashed center line
      const dashSpacing = 6;
      const numDashes = Math.floor(curveLength / dashSpacing);
      const dashGeo = new THREE.PlaneGeometry(0.28, 2.5);
      const dashMat = new THREE.MeshBasicMaterial({ color: 0xffe46b });
      for (let i = 0; i < numDashes; i++) {
        const t = (i * dashSpacing) / curveLength;
        const p = pointAt(t);
        const tn = tangentAt(t);
        const d = new THREE.Mesh(dashGeo, dashMat);
        d.rotation.x = -Math.PI / 2;
        d.rotation.z = -Math.atan2(tn.x, tn.z);
        d.position.set(p.x, 0.06, p.z);
        levelGroup.add(d);
      }

      // decor along curve — denser placement, per-stage flavor
      const carColors = [0x2a6acc, 0x3a8a3a, 0xc8a830, 0x8a3030, 0x444444, 0xc0c0c0, 0x7a4ab8];
      const isDowntown = L.name === 'DOWNTOWN';
      const isAvenue   = L.name === 'AVENUE';

      const stepM = 12;     // tight spacing — every 12m something on each side
      let s = 8;
      while (s < curveLength - 60) {
        const t = s / curveLength;
        const p = pointAt(t);
        const tn = tangentAt(t);
        const rt = rightFromTangent(tn);
        const yaw = Math.atan2(tn.x, tn.z);
        for (const side of [-1, 1]) {
          // primary building (house or downtown building)
          if (Math.random() < L.houseDensity) {
            const b = isDowntown ? makeBuilding() : makeHouse();
            const off = isDowntown ? rand(16, 21) : rand(14, 18);
            b.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            b.rotation.y = yaw + (side === -1 ? Math.PI : 0);
            levelGroup.add(b);
          }
          // tree (more frequent now)
          if (!isDowntown && Math.random() < L.treeDensity) {
            const tr = makeTree();
            const off = rand(9.0, 11.5);
            tr.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            levelGroup.add(tr);
          }
          // mailbox
          if (!isDowntown && Math.random() < L.mailboxDensity) {
            const m = makeMailbox();
            const off = ROAD_W / 2 + 2.4;
            m.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            m.rotation.y = yaw;
            levelGroup.add(m);
          }
          // parked car
          if (Math.random() < L.parkedCarChance) {
            const c = makeCar(carColors[(Math.random() * carColors.length) | 0]);
            const off = ROAD_W / 2 + 2.6;
            c.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            c.rotation.y = yaw + Math.PI / 2 * side;
            levelGroup.add(c);
          }
          // hedge / bush filler (suburb + avenue)
          if (!isDowntown && Math.random() < 0.55) {
            const h = makeHedge(rand(3.5, 5.5));
            const off = ROAD_W / 2 + 3.2;
            h.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            h.rotation.y = yaw;
            levelGroup.add(h);
          }
          if (!isDowntown && Math.random() < 0.35) {
            const b = makeBush();
            const off = rand(7, 13);
            b.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            levelGroup.add(b);
          }
          // garbage cans on curb
          if (Math.random() < 0.18) {
            const gc = makeGarbageCan();
            const off = ROAD_W / 2 + 1.6;
            gc.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            levelGroup.add(gc);
          }
          // fire hydrants — rare
          if (Math.random() < 0.06) {
            const fh = makeFireHydrant();
            const off = ROAD_W / 2 + 1.5;
            fh.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            levelGroup.add(fh);
          }
        }
        s += rand(stepM * 0.85, stepM * 1.2);
      }

      // continuous fence run along each side (suburb only) — placed every ~4m so it follows the curve
      if (L.name === 'SUBURB') {
        for (let fs = 8; fs < curveLength - 8; fs += 3.8) {
          if (Math.random() < 0.55) continue; // gappy
          const t = fs / curveLength;
          const p = pointAt(t);
          const tn = tangentAt(t);
          const rt = rightFromTangent(tn);
          const yaw = Math.atan2(tn.x, tn.z);
          for (const side of [-1, 1]) {
            const fence = makeFenceSegment(3.6);
            const off = ROAD_W / 2 + 3.6;
            fence.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            fence.rotation.y = yaw;
            levelGroup.add(fence);
          }
        }
      }

      // billboards (avenue + downtown) — rare but readable
      if (isAvenue || isDowntown) {
        for (let bs = 60; bs < curveLength - 80; bs += rand(120, 200)) {
          const t = bs / curveLength;
          const p = pointAt(t);
          const tn = tangentAt(t);
          const rt = rightFromTangent(tn);
          const yaw = Math.atan2(tn.x, tn.z);
          const side = Math.random() < 0.5 ? -1 : 1;
          const bb = makeBillboard();
          const off = ROAD_W / 2 + 8;
          bb.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
          bb.rotation.y = yaw + (side === -1 ? 0 : Math.PI);
          levelGroup.add(bb);
        }
      }

      // stop signs at occasional intersections
      for (let ss = 80; ss < curveLength - 60; ss += rand(150, 240)) {
        const t = ss / curveLength;
        const p = pointAt(t);
        const tn = tangentAt(t);
        const rt = rightFromTangent(tn);
        for (const side of [-1, 1]) {
          if (Math.random() < 0.6) {
            const sg = makeStopSign();
            const off = ROAD_W / 2 + 2.0;
            sg.position.set(p.x + rt.x * side * off, 0, p.z + rt.z * side * off);
            levelGroup.add(sg);
          }
        }
      }

      // boost pickups — scatter along curve, alternating lanes
      const pickupCount = 7 + idx; // 7, 8, 9 across the stages
      for (let i = 0; i < pickupCount; i++) {
        const sPos = 120 + (i + 0.5) * ((curveLength - 200) / pickupCount) + rand(-20, 20);
        const lat = (i % 2 === 0 ? 2.5 : -2.5) + rand(-1, 1);
        const t = clamp(sPos / curveLength, 0, 1);
        const p = pointAt(t);
        const tn = tangentAt(t);
        const rt = rightFromTangent(tn);
        const pk = makeBoostPickup();
        pk.position.set(p.x + rt.x * lat, 0, p.z + rt.z * lat);
        levelGroup.add(pk);
        boostPickups.push({ mesh: pk, s: sPos, lat, alive: true, t0: Math.random() * 10 });
      }

      // streetlamps every 14m (denser, more populated feel)
      for (let z = 6; z < curveLength; z += 14) {
        const t = z / curveLength;
        const p = pointAt(t);
        const tn = tangentAt(t);
        const rt = rightFromTangent(tn);
        for (const side of [-1, 1]) {
          const off = ROAD_W / 2 + 1.7;
          const pole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.08, 0.08, 5.5, 6),
            new THREE.MeshLambertMaterial({ color: 0x444 })
          );
          pole.position.set(p.x + rt.x * side * off, 2.75, p.z + rt.z * side * off);
          pole.castShadow = true;
          levelGroup.add(pole);
          // lamp head at top (lit at dusk levels)
          const lamp = new THREE.Mesh(
            new THREE.BoxGeometry(0.4, 0.25, 0.4),
            new THREE.MeshBasicMaterial({ color: isDowntown ? 0xfff5b0 : (isAvenue ? 0xffd9a0 : 0xddddcc) })
          );
          lamp.position.set(p.x + rt.x * side * (off - 0.25), 5.4, p.z + rt.z * side * (off - 0.25));
          levelGroup.add(lamp);
        }
      }

      // obstacles: bumps + potholes distributed along curve
      const sps = [];
      const stride = curveLength / (L.bumps + L.potholes + 1);
      for (let i = 1; i <= L.bumps + L.potholes; i++) sps.push(i * stride + rand(-stride * 0.3, stride * 0.3));
      let bumpsLeft = L.bumps;
      let potsLeft = L.potholes;
      for (const sPos of sps) {
        const t = clamp(sPos / curveLength, 0.04, 0.95);
        const p = pointAt(t);
        const tn = tangentAt(t);
        const rt = rightFromTangent(tn);
        if (bumpsLeft > 0 && (potsLeft === 0 || Math.random() < 0.55)) {
          bumpsLeft--;
          // speed bump with a 2-segment gap
          const seg = ROAD_W / 5;
          const gapStart = Math.floor(Math.random() * 4);
          for (let i = 0; i < 5; i++) {
            if (i === gapStart || i === gapStart + 1) continue;
            const c = (i % 2 === 0) ? 0xfff100 : 0x222222;
            const b = new THREE.Mesh(
              new THREE.BoxGeometry(seg - 0.08, 0.4, 1.0),
              new THREE.MeshLambertMaterial({ color: c })
            );
            const off = (i - 2) * seg;
            b.position.set(p.x + rt.x * off, 0.2, p.z + rt.z * off);
            b.rotation.y = Math.atan2(tn.x, tn.z);
            b.castShadow = true; b.receiveShadow = true;
            levelGroup.add(b);
          }
          const gapMinLat = (gapStart - 2) * seg - seg / 2;
          const gapMaxLat = (gapStart + 1 - 2) * seg + seg / 2;
          obstacles.push({ type: 'bump', t, gapMinLat, gapMaxLat, hit: false });
        } else if (potsLeft > 0) {
          potsLeft--;
          const lat = rand(-3.5, 3.5);
          const m = new THREE.Mesh(
            new THREE.CircleGeometry(1.0, 18),
            new THREE.MeshLambertMaterial({ color: 0x0a0a0a })
          );
          m.rotation.x = -Math.PI / 2;
          m.position.set(p.x + rt.x * lat, 0.03, p.z + rt.z * lat);
          levelGroup.add(m);
          obstacles.push({ type: 'pot', t, lat, hit: false });
        }
      }

      // oncoming traffic — spawn ahead of truck periodically (managed in tick)
      // for now, pre-seed with cars at random s positions ahead
      for (let i = 0; i < L.trafficCount; i++) {
        spawnTrafficCar(rand(80, curveLength - 100));
      }

      // big-box store at end of curve, planted on-axis with parking lot facing the truck
      const endP = pointAt(0.998);
      const endTn = tangentAt(0.998);
      storeMesh = makeStore(L.name === 'DOWNTOWN' ? 'GROC' : L.name === 'AVENUE' ? 'PLAZA' : 'MART');
      // Position store ~80m past curve end along the tangent. Store's local +Z faces -tangent (entrance toward truck).
      const ahead = endP.clone().add(endTn.clone().multiplyScalar(95));
      storeMesh.position.set(ahead.x, 0, ahead.z);
      storeMesh.rotation.y = Math.atan2(endTn.x, endTn.z) + Math.PI;
      levelGroup.add(storeMesh);

      // banner
      showBanner(`STAGE ${idx + 1}`, L.name, 1600);
    }

    function makeStore(name) {
      // massive big-box mart with huge empty parking lot
      const g = new THREE.Group();
      const w = 90, d = 50, h = 14;
      // body
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color: 0xf2f2ec })
      );
      body.position.y = h / 2;
      g.add(body);
      // blue brand band along the top
      const band = new THREE.Mesh(
        new THREE.BoxGeometry(w + 0.4, 2.6, d + 0.4),
        new THREE.MeshLambertMaterial({ color: 0x1c8aff })
      );
      band.position.y = h - 1.3;
      g.add(band);
      // big front sign
      const sign = makeTextSign(`${name}-MART`, 30, 3.2, '#1c8aff', '#ffffff');
      sign.position.set(0, h - 1.3, d / 2 + 0.32);
      g.add(sign);
      // smaller secondary sign
      const sub = makeTextSign('OPEN 24 HRS', 14, 1.4, '#ffffff', '#1c8aff');
      sub.position.set(-w / 2 + 12, 2.0, d / 2 + 0.33);
      g.add(sub);
      // glass entrance row (full-width)
      const glass = new THREE.Mesh(
        new THREE.BoxGeometry(34, 8, 0.12),
        new THREE.MeshBasicMaterial({ color: 0x9fd0ff })
      );
      glass.position.set(0, 4, d / 2 + 0.07);
      g.add(glass);
      // entrance frame
      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(34.5, 8.5, 0.22),
        new THREE.MeshLambertMaterial({ color: 0x666 })
      );
      frame.position.set(0, 4.15, d / 2 + 0.02);
      g.add(frame);
      // sliding-door divider
      for (let i = -1; i <= 1; i += 2) {
        const div = new THREE.Mesh(
          new THREE.BoxGeometry(0.3, 8, 0.16),
          new THREE.MeshLambertMaterial({ color: 0x333 })
        );
        div.position.set(i * 5.7, 4, d / 2 + 0.1);
        g.add(div);
      }
      // back loading bays (visible if truck rolls past)
      for (let i = -3; i <= 3; i++) {
        const bay = new THREE.Mesh(
          new THREE.BoxGeometry(3, 4.5, 0.15),
          new THREE.MeshLambertMaterial({ color: 0x666 })
        );
        bay.position.set(i * 5, 2.25, -d / 2 - 0.05);
        g.add(bay);
      }

      // massive parking lot in front (entrance is on +Z side here, truck arrives via +tangent → entrance)
      const LOT_W = 160, LOT_D = 80;
      const lot = new THREE.Mesh(
        new THREE.PlaneGeometry(LOT_W, LOT_D),
        new THREE.MeshLambertMaterial({ color: 0x5e5e5e })
      );
      lot.rotation.x = -Math.PI / 2;
      lot.position.set(0, 0.05, d / 2 + LOT_D / 2 + 2);
      lot.receiveShadow = true;
      g.add(lot);
      // parking stripes — long grid
      const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const rows = 5;
      for (let row = 0; row < rows; row++) {
        const rowZ = d / 2 + 8 + row * 14;
        for (let i = -12; i <= 12; i++) {
          const s = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 5.5), stripeMat);
          s.rotation.x = -Math.PI / 2;
          s.position.set(i * 6, 0.08, rowZ);
          g.add(s);
        }
      }
      // pole lights scattered across the lot
      for (let i = -2; i <= 2; i++) {
        for (let row = 0; row < 3; row++) {
          const pole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.14, 0.14, 9, 8),
            new THREE.MeshLambertMaterial({ color: 0x444 })
          );
          pole.position.set(i * 28, 4.5, d / 2 + 16 + row * 20);
          pole.castShadow = true;
          g.add(pole);
          const head = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 0.4, 1.6),
            new THREE.MeshBasicMaterial({ color: 0xfff5b0 })
          );
          head.position.set(i * 28, 9.1, d / 2 + 16 + row * 20);
          g.add(head);
        }
      }
      // a couple parked cars + cart corral in the lot
      const carColorsLot = [0x2266cc, 0xc83030, 0xc0c0c0, 0x444, 0xc8a830, 0x7a4ab8];
      for (let i = 0; i < 12; i++) {
        const c = makeCar(carColorsLot[(Math.random() * carColorsLot.length) | 0]);
        c.position.set(rand(-LOT_W / 2 + 6, LOT_W / 2 - 6), 0, d / 2 + rand(8, LOT_D - 4));
        c.rotation.y = Math.random() < 0.5 ? 0 : Math.PI;
        g.add(c);
      }
      // cart corrals — small fenced rectangles with carts inside (yellow!)
      for (let i = -1; i <= 1; i++) {
        const corral = new THREE.Mesh(
          new THREE.BoxGeometry(6, 1.2, 1.6),
          new THREE.MeshLambertMaterial({ color: 0x888 })
        );
        corral.position.set(i * 18, 0.6, d / 2 + 10);
        g.add(corral);
        // a few yellow carts in each corral
        for (let k = 0; k < 4; k++) {
          const c = makeCartMesh();
          c.position.set(i * 18 - 2 + k * 0.55, 0.0, d / 2 + 10);
          c.rotation.y = Math.PI / 2;
          g.add(c);
        }
      }
      // big "ENTRANCE" arrow on the lot pavement pointing toward doors
      const arrow = makeTextSign('→ ENTRANCE →', 18, 1.6, '#5e5e5e', '#ffffff');
      arrow.rotation.x = -Math.PI / 2;
      arrow.position.set(0, 0.085, d / 2 + 28);
      g.add(arrow);

      setShadows(g, true, true);
      return g;
    }

    function spawnTrafficCar(s) {
      const carColors = [0x2a6acc, 0xc8a830, 0x8a3030, 0x444444, 0xc0c0c0, 0x7a4ab8, 0xffffff];
      const c = makeCar(carColors[(Math.random() * carColors.length) | 0]);
      // oncoming car drives in the LEFT lane (negative lateral)
      const lat = rand(-4, -2);
      levelGroup.add(c);
      traffic.push({ mesh: c, s, lat, speed: rand(10, 16), alive: true });
      // initial position
      const t = clamp(s / curveLength, 0, 1);
      const p = pointAt(t);
      const tn = tangentAt(t);
      const rt = rightFromTangent(tn);
      c.position.set(p.x + rt.x * lat, 0, p.z + rt.z * lat);
      c.rotation.y = Math.atan2(-tn.x, -tn.z); // facing opposite of travel
    }

    // =========================================================================
    // input
    // =========================================================================
    const keys = Object.create(null);
    addEventListener('keydown', e => {
      const wasDown = keys[e.key.toLowerCase()];
      keys[e.key.toLowerCase()] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        if (!wasDown && boostMeter > 0) triggerBoostBlast();   // manga burst only when boost is available
      }
      startAudio();
      if (e.key.toLowerCase() === 'm') toggleMute();
    });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
    addEventListener('pointerdown', startAudio);

    // =========================================================================
    // audio: 170 BPM dark d&b / tech-step (procedural, '98 vibe)
    // =========================================================================
    let audioCtx = null;
    let audioStarted = false;
    let audioMaster = null;
    let audioReverb = null;
    let audioMuted = false;
    let nextNoteTime = 0;
    let stepCounter = 0;
    let schedulerHandle = null;
    const BPM = 170;
    const STEP_DUR = 60 / BPM / 4;
    const LOOKAHEAD = 0.12;
    const SCHED_MS = 25;

    const ROOT_HZ = 36.71; // D1

    // 24-bar arrangement: A (groove, 8) → B (breakdown w/ melody, 8) → C (build w/ riser, 8)
    // Each section's bass line: 32 quarter-note semitone offsets (8 bars × 4 quarters)
    const BASS_A = [
      0, 0, 0, -4,   0, 0, -5, -8,   0, 0, 0, -4,   0, 0, -5, -8,
      0, 0, 0, -4,   0, 0, -5, -8,   0, 0, 0, -4,   0, 0, -5, -8,
    ];
    const BASS_B = [
      0, 0, 5, 5,    3, 3, 0, 0,    -2, -2, 3, 3,   5, 7, 0, 0,
      0, 0, 5, 5,    3, 3, 0, 0,    -2, -2, 3, 3,   5, 7, 0, 0,
    ];
    const BASS_C = [
      0, 0, 0, 0,    0, 0, 0, 0,    -2, -2, -2, -2,  -2, -2, -2, -2,
      3, 3, 3, 3,    5, 5, 5, 5,    7, 7, 10, 10,    12, 12, 12, 12,
    ];

    // Section B lead melody — eighths over 8 bars (64 eighths). null = rest. semitones from D3.
    // Phrase repeats twice (4 bars × 2). D minor (notes: D=0, F=3, G=5, A=7, Bb=8, C=10, D=12).
    const MELODY_B = [
      0, null, null, 3,    5, null, 7, null,     3, null, 0, null,    7, null, 3, 0,
      0, null, 3, null,    8, null, 7, 5,        3, 0, null, null,   10, 0, null, null,
      0, null, null, 3,    5, null, 7, null,     3, null, 0, null,    7, null, 3, 0,
      0, null, 3, null,    8, null, 7, 5,        3, 0, null, null,   10, 0, null, null,
    ];

    function startAudio() {
      if (audioStarted) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      audioStarted = true;

      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.knee.value = 6;
      comp.ratio.value = 8;       comp.attack.value = 0.002;
      comp.release.value = 0.18;
      comp.connect(audioCtx.destination);

      // ----- PS1-era lo-fi master chain: bitcrush + lowpass before compression -----
      const lofiLP = audioCtx.createBiquadFilter();
      lofiLP.type = 'lowpass';
      lofiLP.frequency.value = 10500;
      lofiLP.Q.value = 0.6;
      lofiLP.connect(comp);
      const crusher = makeBitcrusher(10);
      crusher.connect(lofiLP);

      audioMaster = audioCtx.createGain();
      audioMaster.gain.value = 0.5;
      audioMaster.connect(crusher);

      const irLen = audioCtx.sampleRate * 2.4;
      const ir = audioCtx.createBuffer(2, irLen, audioCtx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        let prev = 0;
        for (let i = 0; i < d.length; i++) {
          const t = i / d.length;
          const env = Math.pow(1 - t, 3.2) * (i < 80 ? i / 80 : 1);
          const n = (Math.random() * 2 - 1) * env;
          prev = prev * 0.78 + n * 0.22;
          d[i] = prev;
        }
      }
      audioReverb = audioCtx.createConvolver();
      audioReverb.buffer = ir;
      const revGain = audioCtx.createGain();
      revGain.gain.value = 0.32;
      audioReverb.connect(revGain);
      revGain.connect(audioMaster);

      startPad();

      nextNoteTime = audioCtx.currentTime + 0.12;
      stepCounter = 0;
      schedulerHandle = setInterval(audioScheduler, SCHED_MS);

      const lbl = document.getElementById('audioLbl');
      if (lbl) lbl.textContent = '🎵 dark d&b · 170 BPM · press M to mute';
    }
    function toggleMute() {
      if (!audioStarted) return;
      audioMuted = !audioMuted;
      audioMaster.gain.setTargetAtTime(audioMuted ? 0 : 0.5, audioCtx.currentTime, 0.03);
      const lbl = document.getElementById('audioLbl');
      if (lbl) lbl.textContent = audioMuted
        ? '🔇 muted · press M to unmute'
        : '🎵 dark d&b · 170 BPM · press M to mute';
    }
    function makeBitcrusher(bits) {
      const ws = audioCtx.createWaveShaper();
      const samples = 4096;
      const curve = new Float32Array(samples);
      const levels = Math.pow(2, bits);
      for (let i = 0; i < samples; i++) {
        const x = (i / (samples - 1)) * 2 - 1;
        curve[i] = Math.round(x * levels) / levels;
      }
      ws.curve = curve;
      ws.oversample = 'none';
      return ws;
    }

    // current section getter (also exposed for HUD if wanted)
    let currentSection = 'A';

    function audioScheduler() {
      if (!audioCtx) return;
      while (nextNoteTime < audioCtx.currentTime + LOOKAHEAD) {
        const s   = stepCounter;
        const ss  = s % 16;                // sixteenth within bar
        const bar = Math.floor(s / 16);
        const cyclePos = bar % 24;          // position in 24-bar cycle
        const sec = cyclePos < 8 ? 'A' : cyclePos < 16 ? 'B' : 'C';
        const barInSec = cyclePos % 8;
        currentSection = sec;

        if (sec === 'A')      schedSectionA(nextNoteTime, ss, barInSec);
        else if (sec === 'B') schedSectionB(nextNoteTime, ss, barInSec);
        else                  schedSectionC(nextNoteTime, ss, barInSec);

        stepCounter++;
        nextNoteTime += STEP_DUR;
      }
    }

    function schedSectionA(t, ss, bar) {
      // main groove (dark tech-step)
      if (ss === 0 || ss === 11)              scheduleKick(t);
      if (ss === 4 || ss === 12)              scheduleSnare(t);
      if ((ss === 7 || ss === 15) && Math.random() < 0.5) scheduleSnare(t, 0.32);
      if (ss === 2 || ss === 10)              scheduleHat(t, false);
      if (ss === 6 || ss === 14)              scheduleHat(t, true);
      if (ss === 8 && bar % 4 === 0)          scheduleMetal(t);
      if (ss % 4 === 0) {
        const q = bar * 4 + (ss / 4);
        scheduleBass(t, BASS_A[q % BASS_A.length], false);
      }
    }

    function schedSectionB(t, ss, bar) {
      // breakdown — sparse drums + PS1 square-lead melody
      if (ss === 0)               scheduleKick(t);
      if (ss === 12)              scheduleSnare(t);
      if (ss === 6 || ss === 14)  scheduleHat(t, true);
      // melody on eighths
      if (ss % 2 === 0) {
        const eIdx = bar * 8 + (ss / 2);
        const note = MELODY_B[eIdx % MELODY_B.length];
        if (note !== null && note !== undefined) scheduleLead(t, note);
      }
      // bass (slightly softer in breakdown)
      if (ss % 4 === 0) {
        const q = bar * 4 + (ss / 4);
        scheduleBass(t, BASS_B[q % BASS_B.length], true);
      }
    }

    function schedSectionC(t, ss, bar) {
      // build — four-on-the-floor + escalating snare roll + 8-bar riser
      if (ss % 4 === 0)            scheduleKick(t);
      if (ss === 4 || ss === 12)   scheduleSnare(t);
      // escalating snare roll on the last 2 bars of section
      if (bar === 6 && ss % 4 === 0) scheduleSnare(t, 0.35);
      if (bar === 7) {
        // doubles in bar 7, sixteenths in last beat
        if (ss < 12 && ss % 2 === 0)  scheduleSnare(t, 0.4);
        if (ss >= 12)                 scheduleSnare(t, 0.45 + (ss - 12) * 0.04);
      }
      // closed hat every 8th
      if (ss % 2 === 0)            scheduleHat(t, false);
      // metal accent at end of bar
      if (ss === 14 && bar % 2 === 0) scheduleMetal(t);
      // 8-bar riser fires at start of section C
      if (ss === 0 && bar === 0)   scheduleRiser(t, 8 * 16 * STEP_DUR);
      // bass (climbing)
      if (ss % 4 === 0) {
        const q = bar * 4 + (ss / 4);
        scheduleBass(t, BASS_C[q % BASS_C.length], false);
      }
    }
    function envGain(t, peak, attack, decay) {
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.001, t + attack + decay);
      return g;
    }
    function scheduleKick(t) {
      const o = audioCtx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(58, t + 0.045);
      const g = envGain(t, 0.85, 0.002, 0.13);
      o.connect(g); g.connect(audioMaster);
      o.start(t); o.stop(t + 0.16);
      const buf = audioCtx.createBuffer(1, 512, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1600;
      const cg = audioCtx.createGain(); cg.gain.value = 0.5;
      src.connect(hp); hp.connect(cg); cg.connect(audioMaster);
      src.start(t);
    }
    function scheduleSnare(t, vol = 0.9) {
      const dur = 0.28;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 3.0;
      const g = envGain(t, vol * 0.85, 0.001, dur);
      src.connect(bp); bp.connect(g); g.connect(audioMaster);
      const rs = audioCtx.createGain(); rs.gain.value = 0.7;
      g.connect(rs); rs.connect(audioReverb);
      src.start(t);
      const o = audioCtx.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(330, t);
      o.frequency.exponentialRampToValueAtTime(165, t + 0.05);
      const og = envGain(t, 0.55 * vol, 0.001, 0.11);
      o.connect(og); og.connect(audioMaster);
      o.start(t); o.stop(t + 0.13);
      const buf2 = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
      const d2 = buf2.getChannelData(0);
      for (let i = 0; i < d2.length; i++) d2[i] = Math.random() * 2 - 1;
      const src2 = audioCtx.createBufferSource(); src2.buffer = buf2;
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5500;
      const g2 = envGain(t, 0.45 * vol, 0.001, 0.05);
      src2.connect(hp); hp.connect(g2); g2.connect(audioMaster);
      src2.start(t);
    }
    function scheduleHat(t, open) {
      const dur = open ? 0.22 : 0.034;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 9000;
      const g = envGain(t, open ? 0.16 : 0.11, 0.001, dur);
      src.connect(hp); hp.connect(g); g.connect(audioMaster);
      if (open) { const rs = audioCtx.createGain(); rs.gain.value = 0.25; g.connect(rs); rs.connect(audioReverb); }
      src.start(t);
    }
    function scheduleMetal(t) {
      const partials = [2200, 3700, 5300];
      const peaks    = [0.06, 0.05, 0.04];
      for (let i = 0; i < partials.length; i++) {
        const o = audioCtx.createOscillator(); o.type = 'square'; o.frequency.value = partials[i];
        const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = partials[i]; bp.Q.value = 10;
        const g = envGain(t, peaks[i], 0.001, 0.26);
        o.connect(bp); bp.connect(g); g.connect(audioMaster);
        const rs = audioCtx.createGain(); rs.gain.value = 0.5; g.connect(rs); rs.connect(audioReverb);
        o.start(t); o.stop(t + 0.3);
      }
    }
    function scheduleBass(t, semis, soft) {
      const freq = ROOT_HZ * Math.pow(2, semis / 12);
      const dur = STEP_DUR * 4 * 1.04;
      const subAmp  = soft ? 0.42 : 0.55;
      const reeseAmp = soft ? 0.13 : 0.2;
      const sub = audioCtx.createOscillator(); sub.type = 'sine'; sub.frequency.value = freq;
      const subG = audioCtx.createGain();
      subG.gain.setValueAtTime(0, t);
      subG.gain.linearRampToValueAtTime(subAmp, t + 0.015);
      subG.gain.setValueAtTime(subAmp, t + dur - 0.05);
      subG.gain.exponentialRampToValueAtTime(0.001, t + dur);
      sub.connect(subG); subG.connect(audioMaster);
      sub.start(t); sub.stop(t + dur + 0.05);

      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 360; lp.Q.value = 9;
      const lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.55;
      const lfoG = audioCtx.createGain(); lfoG.gain.value = 260;
      lfo.connect(lfoG); lfoG.connect(lp.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.05);

      const gg = audioCtx.createGain();
      gg.gain.setValueAtTime(0, t);
      gg.gain.linearRampToValueAtTime(reeseAmp, t + 0.02);
      gg.gain.setValueAtTime(reeseAmp, t + dur - 0.05);
      gg.gain.exponentialRampToValueAtTime(0.001, t + dur);

      const detunes = [-18, -7, 7, 18];
      for (const dt of detunes) {
        const o = audioCtx.createOscillator(); o.type = 'sawtooth';
        o.frequency.value = freq * 2;
        o.detune.value = dt;
        o.connect(lp);
        o.start(t); o.stop(t + dur + 0.05);
      }
      lp.connect(gg); gg.connect(audioMaster);
      const rs = audioCtx.createGain(); rs.gain.value = 0.18;
      gg.connect(rs); rs.connect(audioReverb);
    }

    function scheduleLead(t, semis) {
      // PS1-game style square lead — slightly detuned, short LP envelope
      // Octave choice: ROOT_HZ * 8 puts us around D4 (293Hz)
      const freq = ROOT_HZ * 8 * Math.pow(2, semis / 12);
      const dur = STEP_DUR * 2 * 0.92;
      const o1 = audioCtx.createOscillator(); o1.type = 'square'; o1.frequency.value = freq;
      const o2 = audioCtx.createOscillator(); o2.type = 'square'; o2.frequency.value = freq; o2.detune.value = 9;
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(2200, t);
      lp.frequency.linearRampToValueAtTime(3800, t + 0.05);
      lp.Q.value = 3.5;
      const g = envGain(t, 0.12, 0.004, dur);
      o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(audioMaster);
      const rs = audioCtx.createGain(); rs.gain.value = 0.32;
      g.connect(rs); rs.connect(audioReverb);
      o1.start(t); o1.stop(t + dur + 0.05);
      o2.start(t); o2.stop(t + dur + 0.05);
    }

    function scheduleRiser(t, dur) {
      // 8-bar bandpassed noise sweep, climbing in frequency and volume
      const samples = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
      const buf = audioCtx.createBuffer(1, samples, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < samples; i++) d[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 5;
      bp.frequency.setValueAtTime(300, t);
      bp.frequency.exponentialRampToValueAtTime(8500, t + dur);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.05, t + dur * 0.4);
      g.gain.linearRampToValueAtTime(0.22, t + dur);
      src.connect(bp); bp.connect(g); g.connect(audioMaster);
      const rs = audioCtx.createGain(); rs.gain.value = 0.6;
      g.connect(rs); rs.connect(audioReverb);
      src.start(t);
    }
    function startPad() {
      const padGain = audioCtx.createGain(); padGain.gain.value = 0.085;
      padGain.connect(audioMaster);
      const f1 = ROOT_HZ * 2;
      const f2 = ROOT_HZ * 2 * Math.pow(2, 8 / 12);
      const o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = f1;
      const o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f2;
      o2.detune.value = -6;
      const og = audioCtx.createGain(); og.gain.value = 0.55;
      o1.connect(og); o2.connect(og); og.connect(padGain);
      o1.start(); o2.start();
      const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 4, audioCtx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const ns = audioCtx.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
      const nbp = audioCtx.createBiquadFilter(); nbp.type = 'bandpass'; nbp.frequency.value = 600; nbp.Q.value = 4;
      const nlfo = audioCtx.createOscillator(); nlfo.type = 'sine'; nlfo.frequency.value = 0.11;
      const nlfoG = audioCtx.createGain(); nlfoG.gain.value = 280;
      nlfo.connect(nlfoG); nlfoG.connect(nbp.frequency);
      const nGain = audioCtx.createGain(); nGain.gain.value = 0.35;
      ns.connect(nbp); nbp.connect(nGain); nGain.connect(padGain);
      const rs = audioCtx.createGain(); rs.gain.value = 0.6;
      nGain.connect(rs); rs.connect(audioReverb);
      ns.start(); nlfo.start();
    }

    // =========================================================================
    // speed streaks — 2D overlay, emanate from truck's screen position with curl
    // =========================================================================
    // Rally-style radial speed lines emanating from the road's vanishing point.
    // Origin is a fixed point near the upper-middle of the screen — the horizon —
    // not the truck. Streaks fly straight out radially toward the screen edges.
    const streaks = [];

    function spawnStreak(cx, cy, factor) {
      const angle = Math.random() * Math.PI * 2;
      // start near the vanishing point so the line "comes from far away"
      const startDist = rand(8, 60);
      const x = cx + Math.cos(angle) * startDist;
      const y = cy + Math.sin(angle) * startDist;
      const speed = rand(700, 1500) * (0.55 + factor);
      streaks.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        len: rand(0.05, 0.11),
        life: rand(0.45, 0.95),
        age: 0,
      });
    }

    function updateStreaks(dt, truckSpd, isBoosting) {
      // factor scales with speed; boost gives extra streak density
      const baseF = clamp((truckSpd - 18) / 30, 0, 1);
      const factor = isBoosting ? Math.min(1, baseF + 0.3) : baseF;
      const cx = innerWidth / 2;
      const cy = innerHeight * 0.42;           // horizon vanishing point

      const target = Math.floor(factor * (isBoosting ? 150 : 80));
      let spawnBudget = Math.min(12, Math.max(0, target - streaks.length));
      while (spawnBudget-- > 0) spawnStreak(cx, cy, factor);

      streakCtx.clearRect(0, 0, innerWidth, innerHeight);
      if (factor <= 0 && streaks.length === 0) return;
      streakCtx.lineCap = 'round';

      for (let i = streaks.length - 1; i >= 0; i--) {
        const s = streaks[i];
        s.age += dt;
        // straight radial motion (no curl) — the road rushing past
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        const t = clamp(1 - s.age / s.life, 0, 1);
        const alpha = t * (0.5 + factor * 0.5);
        const px = s.x - s.vx * s.len;
        const py = s.y - s.vy * s.len;
        // boost: tinted slightly cyan; normal: warm white
        streakCtx.strokeStyle = isBoosting
          ? `rgba(190, 235, 255, ${alpha.toFixed(3)})`
          : `rgba(255, 248, 220, ${alpha.toFixed(3)})`;
        streakCtx.lineWidth = 1 + factor * 1.8 + (isBoosting ? 0.6 : 0);
        streakCtx.beginPath();
        streakCtx.moveTo(px, py);
        streakCtx.lineTo(s.x, s.y);
        streakCtx.stroke();
        if (s.age > s.life || s.x < -40 || s.x > innerWidth + 40 || s.y < -40 || s.y > innerHeight + 40) {
          streaks.splice(i, 1);
        }
      }
    }

    // =========================================================================
    // truck physics (curve-based)
    // =========================================================================
    let truckS = 0;
    let truckLateral = 2.5;          // start in right lane
    let truckSpeed = 14;
    const TRUCK_MIN_SPEED = 8;
    const TRUCK_MAX_SPEED = 42;
    const TRUCK_BOOST_SPEED = 66;
    const TRUCK_ACCEL = 20;
    const TRUCK_BRAKE = 32;
    const TRUCK_DRAG = 4;
    const STEER_SPEED = 8;

    let bumpVel = 0, bumpY = 0, bodyRoll = 0;
    let cameraRoll = 0;            // rally-style banking, eased
    let dropTimer = rand(0.55, 0.85);
    let gameOver = false;
    let startTime = performance.now();

    // ---- boost meter ----
    let boostMeter = 1.0;                 // 0..1
    const BOOST_DRAIN_PER_SEC = 0.32;     // ~3s of full boost
    const BOOST_PICKUP_VALUE = 0.45;      // each pickup
    const BOOST_CRASH_LOSS = 0.6;         // crash empties most of meter

    // HUD elements
    const hudCarts = document.getElementById('carts');
    const hudCartsRow = document.getElementById('cartsRow');
    const hudDist  = document.getElementById('dist');
    const hudSpeed = document.getElementById('speed');
    const hudLvl   = document.getElementById('lvl');
    const hudLvlName = document.getElementById('lvlName');
    const boostFill = document.getElementById('boostFill');
    const boostLabel = document.getElementById('boostLabel');
    const speedoWrap = document.getElementById('speedoWrap');
    const overlay  = document.getElementById('overlay');
    const titleEl  = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const againBtn = document.getElementById('again');
    const vignette = document.getElementById('vignette');
    againBtn.addEventListener('click', () => location.reload());

    function endGame(isWin) {
      if (gameOver) return;
      gameOver = true;
      const seconds = ((performance.now() - startTime) / 1000).toFixed(1);
      titleEl.textContent = isWin ? 'ALL DELIVERIES MADE' : 'OUT OF CARTS';
      titleEl.classList.remove('win', 'lose');
      titleEl.classList.add(isWin ? 'win' : 'lose');
      if (isWin) {
        subtitle.innerHTML =
          `Total time: <strong>${seconds}s</strong> · <strong>${cartsRemaining}</strong> cart${cartsRemaining === 1 ? '' : 's'} left in the truck. ` +
          (cartsRemaining >= 60 ? "Legendary run." :
           cartsRemaining >= 30 ? "Solid." :
           cartsRemaining >  5  ? "Cut it close." :
                                  "Pure adrenaline.");
      } else {
        subtitle.innerHTML = `Ran dry on <strong>STAGE ${levelIdx + 1}</strong> after <strong>${seconds}s</strong>. Should've floored it sooner.`;
      }
      overlay.style.display = 'flex';
    }

    setTimeout(() => document.getElementById('title-card').classList.add('fade'), 100);

    // =========================================================================
    // initial level load
    // =========================================================================
    loadLevel(0);
    hudLvl.textContent = String(levelIdx + 1);
    hudLvlName.textContent = LEVELS[levelIdx].name;

    // =========================================================================
    // main loop
    // =========================================================================
    const clock = new THREE.Clock();
    const _curTan = new THREE.Vector3();
    const _curRt  = new THREE.Vector3();
    const _curP   = new THREE.Vector3();

    function advanceLevel() {
      levelIdx++;
      if (levelIdx >= LEVELS.length) {
        endGame(true);
        return;
      }
      levelTransitioning = true;
      truckS = 0;
      truckLateral = 2.5;
      hudLvl.textContent = String(levelIdx + 1);
      hudLvlName.textContent = LEVELS[levelIdx].name;
      loadLevel(levelIdx);
      // brief speed boost for the level-start surge
      truckSpeed = Math.max(truckSpeed, 18);
      setTimeout(() => { levelTransitioning = false; }, 600);
    }

    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      let steerInput = 0;

      if (!gameOver) {
        // throttle — boost requires a non-empty meter and drains it
        const wantBoost = !!keys[' '] && boostMeter > 0;
        const accel = keys['w'] || keys['arrowup'];
        const brake = keys['s'] || keys['arrowdown'];
        if (wantBoost) {
          truckSpeed += TRUCK_ACCEL * 1.4 * dt;
          boostMeter = Math.max(0, boostMeter - BOOST_DRAIN_PER_SEC * dt);
        } else if (accel) {
          if (truckSpeed < TRUCK_MAX_SPEED) truckSpeed += TRUCK_ACCEL * dt;
        } else if (brake) {
          truckSpeed -= TRUCK_BRAKE * dt;
        } else {
          truckSpeed -= TRUCK_DRAG * dt;
        }
        // boost falloff: above MAX with no boost, decel back to MAX
        if (!wantBoost && truckSpeed > TRUCK_MAX_SPEED) {
          truckSpeed -= 14 * dt;
          if (truckSpeed < TRUCK_MAX_SPEED) truckSpeed = TRUCK_MAX_SPEED;
        }
        truckSpeed = clamp(truckSpeed, TRUCK_MIN_SPEED, TRUCK_BOOST_SPEED);

        // steering (A/← → +lateral=right; D/→ → -lateral=left, per user mapping)
        if (keys['a'] || keys['arrowleft']) steerInput += 1;
        if (keys['d'] || keys['arrowright']) steerInput -= 1;
        truckLateral += steerInput * STEER_SPEED * dt;
        truckLateral = clamp(truckLateral, -LANE_LIMIT, LANE_LIMIT);
        bodyRoll += (-steerInput * 0.09 - bodyRoll) * Math.min(1, dt * 8);

        // advance along curve
        truckS += truckSpeed * dt;
        if (truckS >= curveLength - 14) {
          advanceLevel();
          if (gameOver) return finalize();
        }

        // bounce
        bumpVel -= 40 * dt;
        bumpY += bumpVel * dt;
        if (bumpY < 0) { bumpY = 0; bumpVel = 0; }
      }

      // resolve world position from curve + lateral
      const t = clamp(truckS / curveLength, 0, 1);
      _curP.copy(pointAt(t));
      _curTan.copy(tangentAt(t));
      _curRt.copy(rightFromTangent(_curTan));
      truck.position.x = _curP.x + _curRt.x * truckLateral;
      truck.position.z = _curP.z + _curRt.z * truckLateral;
      truck.position.y = bumpY;

      // truck yaw = tangent heading + small steer-induced yaw + body roll
      truck.rotation.y = Math.atan2(_curTan.x, _curTan.z) + steerInput * 0.05;
      truck.rotation.z = bodyRoll;

      // wheel spin
      const spin = (truckSpeed * dt) / 0.6;
      for (const w of wheels) w.rotation.x -= spin;

      // obstacle hits (curve-space)
      if (!gameOver) {
        for (const o of obstacles) {
          if (o.hit) continue;
          const ds = Math.abs((o.t - t) * curveLength);
          if (ds > 2.5) continue;
          if (o.type === 'bump') {
            const half = 1.3;
            const inGap = (truckLateral - half >= o.gapMinLat) && (truckLateral + half <= o.gapMaxLat);
            if (!inGap) {
              o.hit = true;
              bumpVel = Math.max(7, truckSpeed * 0.4);
              dropCart();
            }
          } else {
            if (Math.abs(truckLateral - o.lat) < 1.6 && ds < 1.4) {
              o.hit = true;
              bumpVel = Math.max(9, truckSpeed * 0.55);
              dropCart(); dropCart();
              truckSpeed *= 0.7;
            }
          }
        }

        // constant cart dribble — your clock
        dropTimer -= dt;
        if (dropTimer <= 0) {
          dropTimer = rand(0.55, 0.85);
          dropCart();
        }

        // win/lose
        if (cartsRemaining <= 0) endGame(false);
        if (cartsRemaining <= 10) hudCartsRow.classList.add('low');
        else hudCartsRow.classList.remove('low');
      }

      // ---- traffic update ----
      for (let i = traffic.length - 1; i >= 0; i--) {
        const c = traffic[i];
        if (!c.alive) { levelGroup.remove(c.mesh); traffic.splice(i, 1); continue; }
        c.s -= c.speed * dt;
        const ct = clamp(c.s / curveLength, 0, 1);
        const cp = pointAt(ct);
        const ctn = tangentAt(ct);
        const crt = rightFromTangent(ctn);
        c.mesh.position.x = cp.x + crt.x * c.lat;
        c.mesh.position.z = cp.z + crt.z * c.lat;
        c.mesh.rotation.y = Math.atan2(-ctn.x, -ctn.z);
        // collision with truck
        if (!gameOver) {
          const dz = (c.s - truckS); // signed distance along curve (car ahead = positive)
          if (Math.abs(dz) < 3.2 && Math.abs(c.lat - truckLateral) < 1.8) {
            // crash: lose a chunk of carts AND boost meter, slow truck, bounce
            for (let k = 0; k < 6; k++) dropCart();
            bumpVel = Math.max(8, truckSpeed * 0.6);
            truckSpeed *= 0.55;
            boostMeter = Math.max(0, boostMeter - BOOST_CRASH_LOSS);
            c.alive = false;
            continue;
          }
        }
        // recycle if car passed behind truck
        if (c.s < truckS - 20) {
          c.alive = false;
        }
      }
      // spawn replacement traffic ahead if under target
      if (!gameOver && !levelTransitioning) {
        const L = LEVELS[levelIdx];
        const liveAhead = traffic.filter(c => c.alive && c.s > truckS - 5).length;
        if (liveAhead < L.trafficCount && truckS < curveLength - 200) {
          if (Math.random() < dt * 0.8) {
            spawnTrafficCar(truckS + rand(110, 230));
          }
        }
      }

      // ---- boost pickups: animate + collect ----
      for (const pu of boostPickups) {
        if (!pu.alive) continue;
        pu.t0 += dt;
        pu.mesh._core.rotation.y += dt * 2.4;
        pu.mesh._core.rotation.x += dt * 1.6;
        pu.mesh._core.position.y = 1.4 + Math.sin(pu.t0 * 3) * 0.18;
        if (!gameOver) {
          const ds = Math.abs(pu.s - truckS);
          const dlat = Math.abs(pu.lat - truckLateral);
          if (ds < 2.2 && dlat < 1.8) {
            pu.alive = false;
            pu.mesh.visible = false;
            boostMeter = Math.min(1.0, boostMeter + BOOST_PICKUP_VALUE);
          }
        }
      }

      // ---- cart stack shuffle (jostle in the bed) ----
      // damped-spring around each cart's base position, impulsed by truck motion
      const shuffleImp = Math.abs(bumpVel) * 0.7 + Math.abs(steerInput) * 2.0 + Math.max(0, truckSpeed - 22) * 0.08;
      const SPRING_K = 140, SPRING_D = 11;
      const lateralKick = -steerInput * 0.18 * Math.min(1, truckSpeed / 20);
      for (let i = 0; i < stackCarts.length; i++) {
        const c = stackCarts[i];
        if (!c.visible) continue;
        const ix = (Math.random() - 0.5) * shuffleImp + lateralKick;
        const iz = (Math.random() - 0.5) * shuffleImp * 0.5 + bumpVel * 0.05;
        const ir = (Math.random() - 0.5) * shuffleImp * 1.2 + lateralKick * 0.5;
        c._wobVX += (-SPRING_K * c._wobX - SPRING_D * c._wobVX + ix) * dt;
        c._wobVZ += (-SPRING_K * c._wobZ - SPRING_D * c._wobVZ + iz) * dt;
        c._wobVR += (-SPRING_K * c._wobR - SPRING_D * c._wobVR + ir) * dt;
        c._wobX += c._wobVX * dt;
        c._wobZ += c._wobVZ * dt;
        c._wobR += c._wobVR * dt;
        c._wobX = clamp(c._wobX, -0.14, 0.14);
        c._wobZ = clamp(c._wobZ, -0.14, 0.14);
        c._wobR = clamp(c._wobR, -0.22, 0.22);
        c.position.x = c._baseX + c._wobX;
        c.position.z = c._baseZ + c._wobZ;
        c.rotation.y = c._wobR;
      }

      // ---- dropped carts: tumble physics → snake-follow chain ----
      truck.updateMatrixWorld();
      const truckBackLocal = new THREE.Vector3(0, 0, BOX_CZ - BOX_D / 2 - 0.4);
      truckBackLocal.applyMatrix4(truck.matrixWorld);
      let leaderX = truckBackLocal.x;
      let leaderZ = truckBackLocal.z;
      for (let i = 0; i < trail.length; i++) {
        const cart = trail[i];
        if (cart._tumbleT > 0) {
          // free physics
          cart._tumbleT -= dt;
          cart._vy -= 22 * dt;
          // air drag
          const drag = Math.pow(0.94, dt * 60);
          cart._vx *= drag; cart._vz *= drag;
          cart.position.x += cart._vx * dt;
          cart.position.y += cart._vy * dt;
          cart.position.z += cart._vz * dt;
          cart.rotation.x += cart._wx * dt;
          cart.rotation.y += cart._wy * dt;
          cart.rotation.z += cart._wz * dt;
          if (cart.position.y <= 0.15) {
            cart.position.y = 0.15;
            cart._vy *= -0.32;
            cart._vx *= 0.55; cart._vz *= 0.55;
            cart._wx *= 0.45; cart._wz *= 0.45;
            cart._bounces++;
            // end tumble when bouncing settles
            if (Math.abs(cart._vy) < 0.5 || cart._bounces > 3) {
              cart._tumbleT = 0;
              cart.rotation.x *= 0.25;
              cart.rotation.z *= 0.25;
            }
          }
        } else {
          // snake-follow trail behavior, with smoothly-eased orientation
          if (cart.position.y > 0.15) {
            cart.position.y += (0.15 - cart.position.y) * Math.min(1, dt * 8);
          }
          const dx = leaderX - cart.position.x;
          const dz = leaderZ - cart.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist > TRAIL_SPACING) {
            const f = (dist - TRAIL_SPACING) / dist;
            cart.position.x += dx * f;
            cart.position.z += dz * f;
            const targetRot = Math.atan2(dx, dz);
            // smooth rotation toward leader
            let drot = targetRot - cart.rotation.y;
            while (drot > Math.PI) drot -= Math.PI * 2;
            while (drot < -Math.PI) drot += Math.PI * 2;
            cart.rotation.y += drot * Math.min(1, dt * 5);
          }
          // ease out residual x/z tilt
          cart.rotation.x *= Math.pow(0.6, dt * 60);
          cart.rotation.z *= Math.pow(0.6, dt * 60);
        }
        leaderX = cart.position.x;
        leaderZ = cart.position.z;
      }
      // cull detached far behind
      for (let i = detached.length - 1; i >= 0; i--) {
        if (detached[i].position.distanceToSquared(truck.position) > 18000) {
          scene.remove(detached[i]);
          detached.splice(i, 1);
        }
      }

      // ---- camera follow + curve lean + shake ----
      // look-ahead tangent so the camera leans into upcoming curves (Outrun trick)
      const lookAheadM = 24 + truckSpeed * 0.7;
      const lookAheadT = clamp((truckS + lookAheadM) / curveLength, 0, 1);
      const aheadTan = tangentAt(lookAheadT);
      const blendTanX = _curTan.x * 0.55 + aheadTan.x * 0.45;
      const blendTanZ = _curTan.z * 0.55 + aheadTan.z * 0.45;
      // higher chase cam so we can see oncoming traffic & the road ahead
      const camTargetX = truck.position.x - blendTanX * 13.5;
      const camTargetY = 8.8 + bumpY * 0.4;
      const camTargetZ = truck.position.z - blendTanZ * 13.5;
      camera.position.x += (camTargetX - camera.position.x) * 0.14;
      camera.position.y += (camTargetY - camera.position.y) * 0.10;
      camera.position.z += (camTargetZ - camera.position.z) * 0.18;
      // shake
      const shakeI = clamp((truckSpeed - 18) / 30, 0, 1);
      const ts = performance.now() * 0.001;
      const sx = (Math.sin(ts * 47) + Math.sin(ts * 23)) * 0.18 * shakeI;
      const sy = (Math.sin(ts * 31) + Math.sin(ts * 19)) * 0.12 * shakeI;
      const sr = (Math.sin(ts * 39) + Math.sin(ts * 13)) * 0.015 * shakeI;
      camera.position.x += sx;
      camera.position.y += sy;
      // look ahead along the (blended) curve so the camera frames the turn
      camera.lookAt(
        truck.position.x + blendTanX * 18,
        2.6 + bumpY * 0.5,
        truck.position.z + blendTanZ * 18
      );
      // rally-style camera bank: roll into the steering direction, eased
      // plus a small contribution from upcoming curvature so corners pre-tilt
      const curveBend = (aheadTan.x * _curTan.z - aheadTan.z * _curTan.x);
      const targetRoll = -steerInput * 0.18 + curveBend * 0.9;
      cameraRoll += (targetRoll - cameraRoll) * Math.min(1, dt * 4.5);
      camera.rotation.z += cameraRoll + sr;

      // light tracking
      shadowTarget.position.copy(truck.position);
      sun.position.set(truck.position.x + 60, truck.position.y + 90, truck.position.z + 40);
      // horizon ring follows the truck so it stays "always far away"
      horizonGroup.position.x = truck.position.x;
      horizonGroup.position.z = truck.position.z;

      // FX scaling
      const blur = clamp((truckSpeed - 26) / 22, 0, 1);
      afterimagePass.uniforms['damp'].value = blur * 0.35;
      const fovFactor = clamp((truckSpeed - 18) / 30, 0, 1);
      camera.fov = 62 + fovFactor * 22;
      camera.updateProjectionMatrix();
      const vAmt = Math.round(60 + fovFactor * 140);
      vignette.style.boxShadow = `inset 0 0 ${vAmt}px ${Math.round(30 + fovFactor * 90)}px rgba(0,0,0,${0.22 + fovFactor * 0.32})`;

      updateStreaks(dt, truckSpeed, !!keys[' '] && boostMeter > 0);

      // boost-blast manga burst (one-shot on SPACE press)
      if (boostBlastTimer > 0) {
        boostBlastTimer -= dt;
        const prog = clamp(1 - boostBlastTimer / BOOST_BLAST_DUR, 0, 1);
        drawBoostBlast(prog);
        if (boostBlastTimer <= 0) {
          blastCtx.clearRect(0, 0, innerWidth, innerHeight);
          blastCanvas.style.opacity = '0';
        }
      }

      if (truckSpeed > TRUCK_MAX_SPEED + 1) speedoWrap.classList.add('boost');
      else speedoWrap.classList.remove('boost');

      hudCarts.textContent = cartsRemaining;
      hudDist.textContent = Math.max(0, Math.round(curveLength - truckS));
      hudSpeed.textContent = Math.round(truckSpeed * 2.237);
      boostFill.style.width = (boostMeter * 100).toFixed(1) + '%';
      if (boostMeter <= 0.001) {
        boostFill.classList.add('empty');
        boostLabel.classList.add('empty');
        boostLabel.textContent = 'EMPTY — GRAB ⬢';
      } else {
        boostFill.classList.remove('empty');
        boostLabel.classList.remove('empty');
        boostLabel.textContent = 'BOOST';
      }

      composer.render();
      requestAnimationFrame(tick);
    }

    function finalize() {
      // run a final render so the end overlay isn't on a frozen frame
      composer.render();
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
